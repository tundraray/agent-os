# Reverse proxy for Agent OS. Include inside the `http {}` block.
upstream agent_os_web { server 127.0.0.1:3000; }
upstream agent_os_api { server 127.0.0.1:4000; }

server {
  listen 80;
  server_name _;

  # Streaming chat: no buffering, long-lived connections.
  location /api/chat/ {
    proxy_pass http://agent_os_api;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_set_header Connection '';
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://agent_os_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://agent_os_web;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }
}
